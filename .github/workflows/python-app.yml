name: Quality

on:
  push:
    branches: ["master", "feat/reporting-completeness"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests with unfiltered coverage
        run: pytest --cov=src/panhunt --cov-config=/dev/null --cov-report=term-missing
      - name: Build distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
