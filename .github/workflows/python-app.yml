name: Quality

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests with unfiltered coverage
        run: pytest --cov=src/panhunt --cov-config=/dev/null --cov-report=term-missing
      - name: Build distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
