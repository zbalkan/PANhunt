[DEFAULT]
search = /opt
outfile = /var/log/panhunt/opt
json = /var/log/panhunt/opt
sizeLimit = 21474836480
quiet = true
# Bounds for hostile embedded document content.
maxXmlBytes = 10485760
maxEmbeddedDocumentBytes = 33554432
parserTimeoutSeconds = 30
parserMemoryLimitBytes = 536870912
maxPdfPages = 100
maxPdfTextBytes = 10485760
